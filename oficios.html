<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Ofícios - UFRR</title>
    <link
      rel="shortcut icon"
      href="./assets/logo_proad.png"
      type="image/x-icon"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .a4-container {
        background: #525659;
        padding: 2rem;
        display: flex;
        justify-content: center;
        overflow: auto;
        max-height: calc(100vh - 4rem);
      }
      .preview-zoom-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex: 0 0 auto;
        transform-origin: top center;
      }
      .a4-document {
        width: 210mm;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .a4-page {
        position: relative;
        width: 210mm;
        height: 297mm;
        min-height: 297mm;
        padding: 25mm;
        box-sizing: border-box;
        background: #fff;
        color: #111;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        font-family: "Times New Roman", Times, serif;
        font-size: 11pt;
        line-height: 1.35;
        text-align: justify;
        overflow: hidden;
        flex: 0 0 297mm;
      }
      .a4-page > * {
        position: relative;
        z-index: 1;
      }
      .a4-page * {
        font-family: inherit;
      }
      .a4-page p {
        margin: 0 0 19pt;
      }
      .oficio-header {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 28pt;
      }
      .oficio-header td,
      .oficio-meta td {
        border: 0;
        padding: 0;
      }
      .oficio-header img {
        width: 72px;
        height: auto;
      }
      .oficio-header .institution {
        color: #777;
        font-weight: bold;
        text-align: center;
        font-family: "Times New Roman", Times, serif;
        font-size: 11pt;
        line-height: 1.15;
      }
      .oficio-meta {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 47pt;
        table-layout: fixed;
        font-size: 11pt;
      }
      .oficio-meta td {
        white-space: normal;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      .oficio-meta td:last-child {
        text-align: right;
      }
      .oficio-recipient {
        margin-bottom: 42pt !important;
        white-space: pre-line;
      }
      .oficio-table {
        width: 100%;
        border-collapse: collapse;
        margin: 16pt 0 42pt;
        text-align: center;
        font-size: 10pt;
      }
      .oficio-table th,
      .oficio-table td {
        border: 1px solid #111;
        padding: 2px 4px;
      }
      .oficio-table th {
        font-weight: bold;
      }
      .oficio-signature {
        position: absolute !important;
        left: 25%;
        bottom: 27mm;
        width: 50%;
        border-top: 1px solid #111;
        padding-top: 4px;
        text-align: center;
        line-height: 1.15;
      }
      .oficio-signature em {
        font-style: italic;
      }
      .dark-mode .a4-page {
        background: #fff;
        color: #111;
      }

      /* Custom scrollbar para melhor estética */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @media (max-width: 768px) {
        .a4-container {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body class="app-page bg-gray-100 h-screen flex flex-col overflow-hidden">
    <header
      class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0"
    >
      <div>
        <h1 class="text-xl font-bold">Sistema de Geração de Ofícios</h1>
        <p class="text-sm text-blue-200">
          Ofícios administrativos - PROAD / UFRR
        </p>
      </div>
      <div class="space-x-2">
        <a
          href="index.html"
          class="inline-block bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-medium transition shadow"
          >Portal inicial</a
        >
        <button
          onclick="exportWord()"
          class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-medium transition shadow"
        >
          Baixar Word (.docx)
        </button>
        <button
          onclick="exportPDF()"
          class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-sm font-medium transition shadow"
        >
          Baixar PDF
        </button>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden flex-col md:flex-row">
      <section
        class="w-full md:w-1/3 bg-white border-r border-gray-200 flex flex-col"
      >
        <div
          class="p-4 bg-gray-50 border-b border-gray-200 font-semibold text-gray-700 flex justify-between items-center shrink-0"
        >
          <h2>Preenchimento de Dados</h2>
          <button
            onclick="gerarDocumento()"
            class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded text-sm transition"
          >
            Gerar Prévia
          </button>
        </div>
        <div class="p-4 overflow-y-auto flex-1 space-y-4">
          <div>
            <label
              class="block text-sm font-medium text-gray-700 mb-1"
              for="tipoOficio"
              >Modelo do ofício</label
            >
            <select
              id="tipoOficio"
              onchange="alternarModelo()"
              class="w-full border border-gray-300 rounded p-2 text-sm bg-white"
            >
              <option value="sicaf">SICAF</option>
              <option value="conta">Conta Vinculada</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="numeroOficio"
                >Nº do ofício</label
              ><input
                id="numeroOficio"
                type="text"
                placeholder="001"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="dataDocumento"
                >Data</label
              ><input
                id="dataDocumento"
                type="date"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
          </div>

          <div id="camposSicaf" class="space-y-4">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="empresaSicaf"
                >Empresa</label
              ><input
                id="empresaSicaf"
                type="text"
                placeholder="Nome da empresa"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="cnpjSicaf"
                  >CNPJ</label
                ><input
                  id="cnpjSicaf"
                  type="text"
                  placeholder="00.000.000/0000-00"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="emailSicaf"
                  >E-mail</label
                ><input
                  id="emailSicaf"
                  type="email"
                  placeholder="empresa@exemplo.com"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="processoSicaf"
                >Processo eletrônico</label
              ><input
                id="processoSicaf"
                type="text"
                placeholder="23129.123456/2025-01"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
              <label class="mt-2 flex items-center gap-2 text-xs text-gray-600">
                <input
                  id="semProcessoSicaf"
                  type="checkbox"
                  class="rounded border-gray-300"
                  onchange="alternarProcessoSicaf()"
                />
                Sem número de processo (S/N)
              </label>
            </div>
          </div>

          <div id="camposConta" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="empresaConta"
                  >Empresa</label
                ><input
                  id="empresaConta"
                  type="text"
                  placeholder="Nome da empresa"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="cnpjConta"
                  >CNPJ</label
                ><input
                  id="cnpjConta"
                  type="text"
                  placeholder="00.000.000/0000-00"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="valorConta"
                  >Valor (R$)</label
                ><input
                  id="valorConta"
                  type="text"
                  placeholder="10.000,00"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="eventoConta"
                  >Evento nº</label
                ><input
                  id="eventoConta"
                  type="text"
                  placeholder="000000"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="contratoConta"
                >Contrato nº</label
              ><input
                id="contratoConta"
                type="text"
                placeholder="Contrato nº"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="bancoConta"
                  >Banco</label
                ><input
                  id="bancoConta"
                  type="text"
                  placeholder="001"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 mb-1"
                  for="agenciaConta"
                  >Agência</label
                ><input
                  id="agenciaConta"
                  type="text"
                  placeholder="1234-5"
                  class="w-full border border-gray-300 rounded p-2 text-sm"
                />
              </div>
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="contaCorrente"
                >Conta corrente</label
              ><input
                id="contaCorrente"
                type="text"
                placeholder="12345-6"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="diaEmail"
                >Data do e-mail</label
              ><input
                id="diaEmail"
                type="date"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              />
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1"
                for="descricaoConta"
                >Descrição / referência</label
              ><textarea
                id="descricaoConta"
                rows="2"
                placeholder="Descrição do contrato ou da solicitação"
                class="w-full border border-gray-300 rounded p-2 text-sm"
              ></textarea>
            </div>
          </div>
        </div>
      </section>

      <section class="w-full md:w-2/3 flex flex-col bg-gray-200">
        <div
          class="preview-toolbar p-2 bg-gray-300 text-center text-sm text-gray-700 font-medium shrink-0 flex items-center justify-center gap-2"
        >
          <button
            type="button"
            onclick="alternarModoEscuro()"
            id="tema-toggle"
            class="bg-white border border-gray-400 rounded px-2 py-0.5 text-xs text-gray-700"
          >
            Modo escuro
          </button>
          <span>Visualização do Documento</span>
          <button
            type="button"
            onclick="alterarZoom(-0.1)"
            class="bg-white border border-gray-400 rounded px-2 py-0.5 text-gray-700"
          >
            −
          </button>
          <button
            type="button"
            id="zoom-indicador"
            onclick="resetarZoom()"
            class="bg-white border border-gray-400 rounded px-2 py-0.5 text-xs text-gray-700"
          >
            100%
          </button>
          <button
            type="button"
            onclick="alterarZoom(0.1)"
            class="bg-white border border-gray-400 rounded px-2 py-0.5 text-gray-700"
          >
            +
          </button>
        </div>
        <div class="a4-container flex-1">
          <div id="preview-zoom-wrapper" class="preview-zoom-wrapper">
            <div id="preview-content" class="a4-document"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="customAlert" class="hidden">
      <div>
        <h3>Aviso</h3>
        <p></p>
      </div>
    </div>

    <script>
      let zoomPreview = 1;
      const chaveNumeroOficio = "sistema_oficios_ultimo_numero";
      const meses = [
        "janeiro",
        "fevereiro",
        "março",
        "abril",
        "maio",
        "junho",
        "julho",
        "agosto",
        "setembro",
        "outubro",
        "novembro",
        "dezembro",
      ];
      const valor = (id, fallback) => {
        const text = document.getElementById(id).value.trim();
        return esc(text || fallback);
      };
      function esc(text) {
        return String(text).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }
      function dataExtenso(data) {
        if (!data) return "{DIA} de {MÊS} de {ANO}";
        const [ano, mes, dia] = data.split("-");
        return `${dia} de ${meses[Number(mes) - 1]} de ${ano}`;
      }
      function dataCurta(data) {
        return data
          ? dataExtenso(data)
          : "{DIA_EMAIL} de {MÊS_EMAIL} de {ANO_EMAIL}";
      }
      function alternarModelo() {
        const conta = document.getElementById("tipoOficio").value === "conta";
        document
          .getElementById("camposConta")
          .classList.toggle("hidden", !conta);
        document
          .getElementById("camposSicaf")
          .classList.toggle("hidden", conta);
        gerarDocumento();
      }
      function alternarProcessoSicaf() {
        const semProcesso = document.getElementById("semProcessoSicaf").checked;
        const campoProcesso = document.getElementById("processoSicaf");
        campoProcesso.disabled = semProcesso;
        campoProcesso.placeholder = semProcesso
          ? "S/N"
          : "23129.123456/2025-01";
        if (semProcesso) campoProcesso.value = "";
      }
      function salvarNumeroOficio() {
        const numero = document.getElementById("numeroOficio").value.trim();
        if (numero) {
          localStorage.setItem(chaveNumeroOficio, numero);
        } else {
          localStorage.removeItem(chaveNumeroOficio);
        }
      }
      function numeroOficioParaArquivo() {
        const numero =
          document.getElementById("numeroOficio").value.trim() || "Sem_Numero";
        return numero.replace(/[\\/:*?"<>|\s]+/g, "_");
      }
      function formatarCnpj(value) {
        const digits = value.replace(/\D/g, "").slice(0, 14);
        return digits.length === 14
          ? digits.replace(
              /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
              "$1.$2.$3/$4-$5",
            )
          : value;
      }
      function header(numero, data) {
        return `<table class="oficio-header"><tr><td style="width:20%;text-align:left;"><img src="img/logo_br.png" alt="Brasão"></td><td style="width:60%;" class="institution">MINISTÉRIO DA EDUCAÇÃO<br>UNIVERSIDADE FEDERAL DE RORAIMA<br>PRÓ-REITORIA DE ADMINISTRAÇÃO</td><td style="width:20%;text-align:right;"><img src="img/logo_ufrr.png" alt="Logo UFRR"></td></tr></table><table class="oficio-meta"><tr><td style="width:56%;">OFÍCIO/PROAD/UFRR nº ${numero} / 2026 - PROAD</td><td style="width:44%;">Boa Vista-RR, ${data}.</td></tr></table>`;
      }
      function assinatura() {
        return `<div class="oficio-signature"><em>Ricardo Morais Albuquerque Silva</em><br><b>Pró-reitor de Administração</b></div>`;
      }
      function gerarDocumento() {
        salvarNumeroOficio();
        const numero = valor("numeroOficio", "{N_OFICIO}"),
          data = dataExtenso(document.getElementById("dataDocumento").value);
        let html = header(numero, data);
        if (document.getElementById("tipoOficio").value === "sicaf") {
          const empresa = valor("empresaSicaf", "{EMPRESA}"),
            cnpj = esc(
              formatarCnpj(document.getElementById("cnpjSicaf").value) ||
                "{CNPJ}",
            ),
            email = valor("emailSicaf", "{EMAIL}"),
            processo = document.getElementById("semProcessoSicaf").checked
              ? "S/N"
              : valor("processoSicaf", "{PROCESSO}");
          html += `<p class="oficio-recipient">À ${empresa}<br>CNPJ nº ${cnpj}</p><p>Enviado ao e-mail: ${email}</p><p style="margin-top:52pt;">Senhor(a) Representante,</p><p>Considerando o que consta no Processo nº ${processo} e em atendimento à Lei nº 14.133/2021, e legislação vigente, a Universidade Federal de Roraima por meio da Pró-Reitoria de Administração, informa que após análise dos dados da referida empresa junto ao SICAF, verificamos que a Regularidade Fiscal se encontra vencida, posto isto, solicitamos que a mesma se regularize e apresente a documentação comprobatória em 05 (cinco) dias úteis, a contar do recebimento deste.</p><p>Comunicamos que o descumprimento deste implicará na aplicação do Art. 3º, inciso III e IV da IN nº 02/2010-SLTI/MPOG.</p><p style="margin-top:118pt;">Atenciosamente,</p>${assinatura()}`;
        } else {
          const empresa = valor("empresaConta", "{EMPRESA}"),
            cnpj = esc(
              formatarCnpj(document.getElementById("cnpjConta").value) ||
                "{CNPJ}",
            );
          html += `<p class="oficio-recipient">AO BANCO DO BRASIL S/A<br>Av. Major Williams, 1018, São Francisco<br>Boa Vista – RR</p><p style="margin-top:42pt;">Senhor Gerente,</p><p>Solicito DEBITAR, conforme indicado a seguir, a movimentação de R$ ${valor("valorConta", "{VALOR}")}, do Depósito em Garantia - bloqueado para movimentação, do evento nº ${valor("eventoConta", "{EVENTO}")}, da empresa ${empresa}, inscrita no CNPJ sob o Nº ${cnpj}, aberta para receber recursos retidos de rubricas constantes da planilha de custos e formação de preços do Contrato nº ${valor("contratoConta", "{CONTRATO}")}, firmado por esta ADMINISTRAÇÃO PÚBLICA FEDERAL, e CREDITAR a conta conforme dados a seguir:</p><table class="oficio-table"><tr><th>BANCO</th><th>AGÊNCIA</th><th>CONTA CORRENTE</th><th>NOME</th><th>CNPJ</th></tr><tr><td>${valor("bancoConta", "{BANCO}")}</td><td>${valor("agenciaConta", "{AGENCIA}")}</td><td>${valor("contaCorrente", "{CONTA_CORRENTE}")}</td><td>${empresa}</td><td>${cnpj}</td></tr></table><p>Em atendimento ao E-mail Eletrônico do dia ${dataCurta(document.getElementById("diaEmail").value)}, na qual faz análise e solicita a liberação de valores da conta vinculada para ${valor("descricaoConta", "{DESCRICAO}")} no referido contrato.</p><p style="margin-top:112pt;">Atenciosamente,</p>${assinatura()}`;
        }
        document.getElementById("preview-content").innerHTML =
          `<div class="a4-page" contenteditable="true" spellcheck="false">${html}</div>`;
        atualizarZoom();
      }
      function atualizarZoom() {
        const preview = document.getElementById("preview-content"),
          wrapper = document.getElementById("preview-zoom-wrapper");
        preview.style.transform = `scale(${zoomPreview})`;
        preview.style.transformOrigin = "top center";
        wrapper.style.width = `${preview.offsetWidth * zoomPreview}px`;
        wrapper.style.height = `${preview.offsetHeight * zoomPreview}px`;
        document.getElementById("zoom-indicador").textContent =
          `${Math.round(zoomPreview * 100)}%`;
      }
      function alterarZoom(value) {
        zoomPreview = Math.min(
          1.5,
          Math.max(0.5, Number((zoomPreview + value).toFixed(1))),
        );
        atualizarZoom();
      }
      function resetarZoom() {
        zoomPreview = 1;
        atualizarZoom();
      }
      function alternarModoEscuro() {
        document.body.classList.toggle("dark-mode");
      }
      function mostrarAlerta(mensagem) {
        const box = document.getElementById("customAlert");
        box.querySelector("p").textContent = mensagem;
        box.classList.remove("hidden");
        setTimeout(() => box.classList.add("hidden"), 3000);
      }
      function exportPDF() {
        const element = document.getElementById("preview-content");
        element.style.transform = "none";
        html2pdf()
          .set({
            margin: 0,
            filename: `Oficio_${document.getElementById("tipoOficio").value}_${numeroOficioParaArquivo()}.pdf`,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          })
          .from(element)
          .save()
          .then(() => {
            element.style.transform = `scale(${zoomPreview})`;
            atualizarZoom();
          });
      }
      async function prepararHtmlWord(element) {
        const clone = element.cloneNode(true);
        await Promise.all(
          [...clone.querySelectorAll("img")].map(async (imagem) => {
            const resposta = await fetch(
              new URL(imagem.getAttribute("src"), document.baseURI),
            );
            const blob = await resposta.blob();
            imagem.src = await new Promise((resolve, reject) => {
              const leitor = new FileReader();
              leitor.onloadend = () => resolve(leitor.result);
              leitor.onerror = reject;
              leitor.readAsDataURL(blob);
            });
          }),
        );
        return `<html><head><meta charset="utf-8"><style>body{font-family:'Times New Roman',Times,serif;font-size:11pt;line-height:1.35}table{border-collapse:collapse;width:100%}th,td{border:1px solid #111;padding:3px}.oficio-header td,.oficio-meta td{border:0}.oficio-meta{table-layout:fixed}.oficio-meta td{white-space:normal;overflow-wrap:anywhere}.oficio-signature{text-align:center;margin:110pt auto 0;width:50%;border-top:1px solid #111}</style></head><body>${clone.innerHTML}</body></html>`;
      }
      async function exportWord() {
        const element = document.getElementById("preview-content");
        if (!element.innerHTML.trim())
          return mostrarAlerta("Gere a prévia antes de baixar.");
        if (!window.htmlDocx)
          return mostrarAlerta("Conversor DOCX indisponível. Verifique sua conexão.");
        const html = await prepararHtmlWord(element);
        const blob = htmlDocx.asBlob(html);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Oficio_${document.getElementById("tipoOficio").value}_${numeroOficioParaArquivo()}.docx`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      }
      window.addEventListener("resize", atualizarZoom);
      window.onload = () => {
        const hoje = new Date().toISOString().split("T")[0];
        document.getElementById("dataDocumento").value = hoje;
        document.getElementById("diaEmail").value = hoje;
        document.getElementById("numeroOficio").value =
          localStorage.getItem(chaveNumeroOficio) || "";
        document
          .getElementById("numeroOficio")
          .addEventListener("input", salvarNumeroOficio);
        alternarModelo();
      };
    </script>
  </body>
</html>
